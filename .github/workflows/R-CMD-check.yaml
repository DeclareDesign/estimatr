# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# This is the rewrite branch's own workflow. `main`'s triggers on
# [main, master] and would never fire here. Every dependency of this branch is
# on CRAN. The comparisons against 1.0.6 read a recorded fixture rather than
# installing the older version, so nothing here depends on estimatr itself.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

name: R-CMD-check.yaml

permissions: read-all

# A push that supersedes a running check cancels it. The branch is worked on
# in bursts, and every run notifies the repository's watchers.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          # "always" sends macOS to Posit Package Manager as well as Linux.
          # CRAN served part of its macOS arm64 R 4.6 binaries as zstd archives
          # under the .tgz name from 2026-09-17, estimatr 2.0.0 among them, and
          # the pak that setup-r-dependencies installs cannot extract zstd
          # (r-lib/pkgdepends#485). Posit Package Manager still serves gzip
          # builds of the same versions.
          # Back to "true" once a released pak reads zstd.
          use-public-rspm: always

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
