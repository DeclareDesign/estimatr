# Builds the pkgdown site without deploying it.
#
# declaredesign.org owns publishing: its "Build Pkgdown" workflow clones this
# repository nightly and pushes the result to that site's gh-pages. This job
# exists to catch, on the commit that causes it, what only ever surfaced there.
#
# On this branch three vignettes are in the tarball and R-CMD-check rebuilds
# them, but `performance` and `estimatr-in-the-tidyverse` and
# `regression-tables` are .Rbuildignore'd, so this job is the only thing that
# builds those three. Their chunks are guarded with requireNamespace(), which
# means a missing package renders the page without its output and stays green:
# every package they load is declared in Suggests so that cannot happen
# quietly.
#
# It also runs pkgdown's reference-index check, so an exported function that
# nobody added to _pkgdown.yml fails here rather than in the other repository.
on:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [rewrite]
  pull_request:
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
